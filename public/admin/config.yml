backend:
  name: github
  repo: Enyell07/ensenando-aprendiendo
  branch: main

locale: "es"
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "biblioteca"
    label: "Biblioteca"
    folder: "src/content/biblioteca"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "Tipo", name: "tipo", widget: "select", options: ["PDF", "Enlace", "Actividad", "Lectura"] }
      - { label: "Público", name: "publico", widget: "select", options: ["Estudiantes", "Docentes", "General"] }
      - { label: "Descripción", name: "descripcion", widget: "text" }
      - { label: "Enlace (opcional)", name: "enlace", widget: "string", required: false }
      - { label: "Archivo PDF o documento (opcional)", name: "archivo", widget: "file", required: false }
      - { label: "Contenido", name: "body", widget: "markdown", required: false }

  - name: "aula"
    label: "Aula"
    folder: "src/content/aula"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "Autor", name: "autor", widget: "string", default: "El profe Angel" }
      - { label: "Fecha", name: "fecha", widget: "datetime" }
      - { label: "Categoría", name: "categoria", widget: "string" }
      - { label: "Imagen", name: "imagen", widget: "image", required: false }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "institucion"
    label: "Reseña de la institución"
    files:
      - label: "Reseña, misión y visión"
        name: "resena"
        file: "src/content/institucion/resena.md"
        format: "frontmatter"
        fields:
          - { label: "Reseña", name: "resumen", widget: "text" }
          - { label: "Misión", name: "mision", widget: "text" }
          - { label: "Visión", name: "vision", widget: "text" }
          - { label: "Foto o escudo", name: "foto", widget: "image", required: false }

  - name: "episodios_extra"
    label: "Información extra de episodios"
    folder: "src/content/episodios_extra"
    create: true
    identifier_field: "slug_episodio"
    slug: "{{slug}}"
    fields:
      - { label: "Dirección del episodio (lo que va después de /podcast/ en su enlace)", name: "slug_episodio", widget: "string" }
      - { label: "Transcripción", name: "transcripcion", widget: "text", required: false }
      - label: "Recursos del episodio (el primero es el recurso de la semana)"
        name: "recursos"
        widget: "list"
        required: false
        fields:
          - { label: "Título", name: "titulo", widget: "string" }
          - { label: "Enlace o archivo", name: "enlace", widget: "file" }
