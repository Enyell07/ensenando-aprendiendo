backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "biblioteca"
    label: "Biblioteca"
    folder: "src/content/biblioteca"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - label: "Tipo"
        name: "tipo"
        widget: "select"
        options: ["PDF", "Enlace", "Actividad", "Lectura"]
      - label: "Público"
        name: "publico"
        widget: "select"
        options: ["Estudiantes", "Docentes", "General"]
      - { label: "Descripción", name: "descripcion", widget: "text" }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "aula"
    label: "Aula"
    folder: "src/content/aula"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "Autor", name: "autor", widget: "string", default: "El profe Angel" }
      - { label: "Fecha", name: "fecha", widget: "datetime" }
      - { label: "Categoría", name: "categoria", widget: "string" }
      - { label: "Imagen", name: "imagen", widget: "image", required: false }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "institucion"
    label: "Reseña de la institución"
    files:
      - label: "Reseña, misión y visión"
        name: "resena"
        file: "src/content/institucion/resena.md"
        format: "frontmatter"
        fields:
          - { label: "Reseña", name: "resumen", widget: "text" }
          - { label: "Misión", name: "mision", widget: "text" }
          - { label: "Visión", name: "vision", widget: "text" }
          - { label: "Foto o escudo", name: "foto", widget: "image", required: false }

  - name: "episodios_extra"
    label: "Información extra de episodios"
    folder: "src/content/episodios_extra"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Slug del episodio (debe coincidir con el título en YouTube)", name: "slug_episodio", widget: "string" }
      - { label: "Transcripción", name: "transcripcion", widget: "markdown", required: false }
      - { label: "Recursos relacionados", name: "recursos", widget: "list", required: false }
